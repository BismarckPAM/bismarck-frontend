[pytest]
testpaths = tests
addopts = -ra --tb=short
markers =
    sprint2: Sprint 2 acceptance-criteria coverage
    policy: Access Policy UI / BIS-203 / BIS-205 coverage
    simulator: Access Check Simulator / BIS-202 / BIS-205 / BIS-208 coverage
    smoke: fast deployed-environment smoke test
    regression: pre-existing authentication/navigation regression coverage
    destructive: creates/updates/deactivates QA data in the deployed environment
