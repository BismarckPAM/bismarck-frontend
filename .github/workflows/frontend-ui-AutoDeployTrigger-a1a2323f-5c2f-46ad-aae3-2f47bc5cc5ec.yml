name: Trigger auto deployment for frontend-ui

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ deploy/production ]
    paths:
    - '**'
    - '.github/workflows/frontend-ui-AutoDeployTrigger-a1a2323f-5c2f-46ad-aae3-2f47bc5cc5ec.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FRONTENDUI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FRONTENDUI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FRONTENDUI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bismarckregistry.azurecr.io
          registryUsername: ${{ secrets.FRONTENDUI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FRONTENDUI_REGISTRY_PASSWORD }}
          containerAppName: frontend-ui
          resourceGroup: bismarck-pam-rg
          imageToBuild: bismarckregistry.azurecr.io/frontend-ui:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


