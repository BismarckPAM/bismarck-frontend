name: Trigger auto deployment for frontend-ui

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: [deploy/production]
    paths:
      - '**'
      - '.github/workflows/frontend-ui-AutoDeployTrigger-a1a2323f-5c2f-46ad-aae3-2f47bc5cc5ec.yml'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Check Turnstile configuration
        env:
          VITE_TURNSTILE_SITEKEY: ${{ secrets.VITE_TURNSTILE_SITEKEY }}
        run: test -n "$VITE_TURNSTILE_SITEKEY" || (echo "Missing VITE_TURNSTILE_SITEKEY GitHub secret" >&2; exit 1)

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FRONTENDUI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FRONTENDUI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FRONTENDUI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: bismarckregistry.azurecr.io
          registryUsername: ${{ secrets.FRONTENDUI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FRONTENDUI_REGISTRY_PASSWORD }}
          containerAppName: frontend-ui
          resourceGroup: bismarck-pam-rg
          imageToBuild: bismarckregistry.azurecr.io/frontend-ui:${{ github.sha }}
          buildArguments: >-
            VITE_API_URL=https://gateway.mangopond-f3cfcd27.southeastasia.azurecontainerapps.io
            VITE_AUTHORIZATION_API_URL=https://gateway.mangopond-f3cfcd27.southeastasia.azurecontainerapps.io
            VITE_TURNSTILE_SITEKEY=${{ secrets.VITE_TURNSTILE_SITEKEY }}
